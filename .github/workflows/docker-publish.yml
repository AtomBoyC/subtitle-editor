name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra image tag (e.g. 2.0.0)"
        required: false
        default: "2.0.0"

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & run automated tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Studio test suite before image build
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Set up QEMU (multi-arch arm64 + amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials & prepare image list
        id: dh_creds
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          LOWER_OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${LOWER_OWNER}/listento-subtitle-editor"
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            LOWER_USER=$(echo "$DH_USER" | tr '[:upper:]' '[:lower:]')
            {
              echo "images<<EOF"
              echo "${GHCR_IMAGE}"
              echo "${LOWER_USER}/listento-subtitle-editor"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "images=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets not set yet; publishing to GHCR (${GHCR_IMAGE}) first."
          fi

      - name: Log in to Docker Hub
        if: steps.dh_creds.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dh_creds.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=2.0.0,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch Docker image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
